<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Dog mascot sticker — Cream Coffee theme">
  <defs>
    <linearGradient id="dDog" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#fff2de"/>
      <stop offset="52%" stop-color="#e7c9a6"/>
      <stop offset="100%" stop-color="#b07a45"/>
    </linearGradient>
    <linearGradient id="dEar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5327"/>
      <stop offset="100%" stop-color="#5a3418"/>
    </linearGradient>
    <linearGradient id="dMuzzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#ffeed6"/>
    </linearGradient>
    <filter id="shadowDog" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3b2b20" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="188" height="188" rx="42" fill="white" opacity="0.97" filter="url(#shadowDog)"/>
  <rect x="10" y="10" width="180" height="180" rx="38" fill="#f4ece0" opacity="0.55"/>
  <!-- Floppy ears -->
  <ellipse cx="52" cy="84" rx="26" ry="48" fill="url(#dEar)" stroke="white" stroke-width="4.5" transform="rotate(-12 52 84)"/>
  <ellipse cx="148" cy="84" rx="26" ry="48" fill="url(#dEar)" stroke="white" stroke-width="4.5" transform="rotate(12 148 84)"/>
  <ellipse cx="52" cy="88" rx="11" ry="22" fill="#dcc09a" opacity="0.5" transform="rotate(-12 52 88)"/>
  <ellipse cx="148" cy="88" rx="11" ry="22" fill="#dcc09a" opacity="0.5" transform="rotate(12 148 88)"/>
  <!-- Head -->
  <circle cx="100" cy="104" r="56" fill="url(#dDog)" stroke="white" stroke-width="5"/>
  <!-- Ears overlap head slightly — patch -->
  <!-- Muzzle -->
  <ellipse cx="100" cy="132" rx="36" ry="30" fill="url(#dMuzzle)" stroke="white" stroke-width="2"/>
  <ellipse cx="100" cy="124" rx="10" ry="7.5" fill="#3b2b20"/>
  <ellipse cx="98" cy="122" rx="2.6" ry="2" fill="white" opacity="0.92"/>
  <path d="M88 138 q12 8 24 0" fill="none" stroke="#3b2b20" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M100 132 v10" fill="none" stroke="#3b2b20" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="80" cy="102" r="7.5" fill="#3b2b20"/>
  <circle cx="120" cy="102" r="7.5" fill="#3b2b20"/>
  <circle cx="82" cy="100" r="2.5" fill="white" opacity="0.96"/>
  <circle cx="122" cy="100" r="2.5" fill="white" opacity="0.96"/>
  <circle cx="80" cy="104.5" r="1.2" fill="#dcc09a" opacity="0.95"/>
  <circle cx="120" cy="104.5" r="1.2" fill="#dcc09a" opacity="0.95"/>
  <!-- Eyebrow spots -->
  <ellipse cx="80" cy="86" rx="14" ry="9" fill="#8a5327" opacity="0.22"/>
  <ellipse cx="120" cy="86" rx="14" ry="9" fill="#8a5327" opacity="0.22"/>
  <!-- Blush -->
  <ellipse cx="62" cy="122" rx="9" ry="6" fill="#ffb8a8" opacity="0.22"/>
  <ellipse cx="138" cy="122" rx="9" ry="6" fill="#ffb8a8" opacity="0.22"/>
</svg>
