<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Bunny mascot sticker — Dark Mint theme">
  <defs>
    <linearGradient id="bBunny" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#e8fff6"/>
      <stop offset="100%" stop-color="#a0dda5"/>
    </linearGradient>
    <linearGradient id="bInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffdfee"/>
      <stop offset="100%" stop-color="#ffb8d1"/>
    </linearGradient>
    <filter id="shadowBunny" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a110f" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Sticker backing -->
  <rect x="6" y="6" width="188" height="188" rx="42" fill="white" opacity="0.96" filter="url(#shadowBunny)"/>
  <rect x="10" y="10" width="180" height="180" rx="38" fill="#0a110f" opacity="0.04"/>
  <!-- Ears -->
  <ellipse cx="72" cy="48" rx="28" ry="54" fill="url(#bBunny)" stroke="white" stroke-width="5"/>
  <ellipse cx="128" cy="48" rx="28" ry="54" fill="url(#bBunny)" stroke="white" stroke-width="5"/>
  <ellipse cx="72" cy="52" rx="12" ry="28" fill="url(#bInner)" opacity="0.95"/>
  <ellipse cx="128" cy="52" rx="12" ry="28" fill="url(#bInner)" opacity="0.95"/>
  <!-- Head -->
  <circle cx="100" cy="112" r="54" fill="url(#bBunny)" stroke="white" stroke-width="5"/>
  <!-- Face -->
  <circle cx="82" cy="110" r="7" fill="#1a2e22"/>
  <circle cx="118" cy="110" r="7" fill="#1a2e22"/>
  <circle cx="84" cy="108" r="2.2" fill="white" opacity="0.9"/>
  <circle cx="120" cy="108" r="2.2" fill="white" opacity="0.9"/>
  <path d="M94 126 q6 8 12 0" fill="none" stroke="#1a2e22" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="100" cy="122" rx="4.5" ry="3.2" fill="#ff7a9e" opacity="0.95"/>
  <!-- Blush -->
  <ellipse cx="62" cy="120" rx="10" ry="6" fill="#ffb8d1" opacity="0.35"/>
  <ellipse cx="138" cy="120" rx="10" ry="6" fill="#ffb8d1" opacity="0.35"/>
  <!-- Bow -->
  <path d="M100 82 l 14 -10 l 4 10 l -4 10 Z" fill="#86dfce" stroke="#0a110f" stroke-opacity="0.08" stroke-width="1.5"/>
  <path d="M100 82 l -14 -10 l -4 10 l 4 10 Z" fill="#86dfce" stroke="#0a110f" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="100" cy="82" r="5.5" fill="#0a110f"/>
</svg>
