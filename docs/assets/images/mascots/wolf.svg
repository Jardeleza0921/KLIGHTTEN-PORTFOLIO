  <path d="M158 68 L142 18 L116 58 Z" fill="#d8dade" stroke="white" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M52 62 L61 30 L78 54 Z" fill="url(#wInnerWolf)" opacity="0.95"/>
  <path d="M148 62 L139 30 L122 54 Z" fill="url(#wInnerWolf)" opacity="0.95"/>
