  <path d="M100 62 c -34 0 -62 22 -62 50 c 0 24 16 40 26 52 h72 c 10 -12 26 -28 26 -52 c 0 -28 -28 -50 -62 -50 Z" fill="url(#wWolf)" stroke="white" stroke-width="5" stroke-linejoin="round"/>
  <!-- Muzzle -->
