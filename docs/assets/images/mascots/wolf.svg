<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Wolf mascot sticker — Black White theme">
  <defs>
    <linearGradient id="wWolf" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0%" stop-color="#f2f2f4"/>
      <stop offset="100%" stop-color="#b8bbc1"/>
    </linearGradient>
    <linearGradient id="wInnerWolf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6d6db"/>
      <stop offset="100%" stop-color="#9aa0aa"/>
    </linearGradient>
    <filter id="shadowWolf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0c0c0d" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="188" height="188" rx="42" fill="white" opacity="0.97" filter="url(#shadowWolf)"/>
  <rect x="10" y="10" width="180" height="180" rx="38" fill="#0c0c0d" opacity="0.03"/>
