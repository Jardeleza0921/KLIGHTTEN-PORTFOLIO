<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Dog Cream Coffee anime background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#f4ece0"/>
      <stop offset="55%" stop-color="#efe3d3"/>
      <stop offset="100%" stop-color="#e6d5be"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="22%" cy="24%" r="56%">
      <stop offset="0%" stop-color="#b07a45" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#b07a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softCream" cx="82%" cy="78%" r="50%">
      <stop offset="0%" stop-color="#8a5327" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8a5327" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depthWarm" cx="50%" cy="110%" r="68%">
      <stop offset="0%" stop-color="#8a5327" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8a5327" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridCream" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#3b2b20" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="cafeFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2b20" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3b2b20" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#warmGlow)"/>
  <rect width="1920" height="1080" fill="url(#softCream)"/>
  <rect width="1920" height="1080" fill="url(#depthWarm)"/>
  <!-- Warm cafe street horizon — cream coffee atmosphere -->
  <path d="M0 760 L80 732 L160 708 L240 724 L320 688 L400 702 L480 668 L560 684 L640 642 L720 658 L800 618 L880 634 L960 596 L1040 612 L1120 572 L1200 588 L1280 548 L1360 566 L1440 526 L1520 544 L1600 504 L1680 522 L1760 482 L1840 502 L1920 468 L1920 1080 L0 1080 Z" fill="#dcc09a" opacity="0.42"/>
  <path d="M0 790 L60 760 L180 748 L280 732 L380 718 L480 702 L580 686 L680 670 L780 652 L880 634 L980 616 L1080 598 L1180 580 L1280 564 L1380 548 L1480 534 L1580 522 L1680 512 L1780 502 L1920 494 L1920 1080 L0 1080 Z" fill="#fffaf2" opacity="0.38"/>
  <path d="M0 840 L120 818 L240 800 L360 782 L480 764 L600 746 L720 728 L840 710 L960 692 L1080 674 L1200 656 L1320 638 L1440 620 L1560 606 L1680 594 L1800 582 L1920 574 L1920 1080 L0 1080 Z" fill="url(#cafeFade)" opacity="0.9"/>
  <!-- Cafe warm lights -->
  <g opacity="0.24" fill="#8a5327">
    <rect x="420" y="690" width="18" height="22" rx="2"/><rect x="560" y="668" width="14" height="24" rx="2"/>
    <rect x="740" y="630" width="16" height="26" rx="2"/><rect x="960" y="610" width="20" height="22" rx="2"/>
    <rect x="1180" y="580" width="14" height="24" rx="2"/><rect x="1420" y="545" width="18" height="20" rx="2"/>
  </g>
  <!-- Subtle steam / bokeh circles -->
  <g fill="#ffffff" opacity="0.08">
    <circle cx="520" cy="420" r="2"/><circle cx="740" cy="380" r="1.6"/><circle cx="960" cy="340" r="2.2"/><circle cx="1180" cy="400" r="1.4"/><circle cx="1420" cy="460" r="1.8"/>
  </g>
  <rect width="1920" height="1080" fill="url(#gridCream)" opacity="0.45"/>
  <!-- Dog silhouette — faint top-right, floppy ears -->
  <g opacity="0.07" fill="#8a5327">
    <ellipse cx="1540" cy="388" rx="34" ry="52" transform="rotate(-12 1540 388)"/>
    <ellipse cx="1680" cy="388" rx="34" ry="52" transform="rotate(12 1680 388)"/>
    <circle cx="1610" cy="520" r="98"/>
    <ellipse cx="1610" cy="558" rx="44" ry="28" fill="#b07a45" opacity="0.14"/>
  </g>
</svg>
