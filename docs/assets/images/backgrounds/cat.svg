<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Cat Neon Arcade anime background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#0b0c13"/>
      <stop offset="100%" stop-color="#141728"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="18%" cy="22%" r="60%">
      <stop offset="0%" stop-color="#bca8ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#bca8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow" cx="86%" cy="20%" r="48%">
      <stop offset="0%" stop-color="#86dfce" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#86dfce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetDepth" cx="50%" cy="108%" r="68%">
      <stop offset="0%" stop-color="#6f5bff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6f5bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gridNeon" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#bca8ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#86dfce" opacity="0.18"/>
    </pattern>
    <linearGradient id="cityFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#purpleGlow)"/>
  <rect width="1920" height="1080" fill="url(#mintGlow)"/>
  <rect width="1920" height="1080" fill="url(#violetDepth)"/>
  <!-- Perspective arcade street — neon horizon -->
  <path d="M0 760 L62 732 L138 708 L210 724 L298 690 L368 704 L462 672 L542 688 L632 646 L718 664 L812 618 L902 634 L992 590 L1080 606 L1172 562 L1260 580 L1350 538 L1440 558 L1532 516 L1620 534 L1712 492 L1800 512 L1920 488 L1920 1080 L0 1080 Z" fill="#0f1020" opacity="0.62"/>
  <path d="M0 820 L80 802 L170 786 L260 770 L360 752 L460 734 L560 714 L660 694 L760 672 L860 650 L960 628 L1060 606 L1160 584 L1260 564 L1360 545 L1460 528 L1560 514 L1660 502 L1760 494 L1920 486 L1920 1080 L0 1080 Z" fill="url(#cityFade)" opacity="0.9"/>
  <!-- Neon signage lights -->
  <g opacity="0.42">
    <rect x="420" y="690" width="56" height="10" rx="5" fill="#bca8ff"/>
    <rect x="520" y="660" width="22" height="34" rx="3" fill="#86dfce" opacity="0.55"/>
    <rect x="740" y="610" width="48" height="8" rx="4" fill="#ff7ad1" opacity="0.5"/>
    <rect x="960" y="600" width="62" height="10" rx="5" fill="#bca8ff"/>
    <rect x="1180" y="570" width="18" height="28" rx="3" fill="#86dfce" opacity="0.6"/>
    <rect x="1420" y="540" width="44" height="8" rx="4" fill="#bca8ff" opacity="0.5"/>
    <rect x="1620" y="520" width="38" height="10" rx="5" fill="#ff7ad1" opacity="0.45"/>
  </g>
  <!-- Grid perspective floor -->
  <rect width="1920" height="1080" fill="url(#gridNeon)" opacity="0.5"/>
  <rect width="1920" height="1080" fill="url(#dots)" opacity="0.18"/>
  <!-- Cat silhouette — faint top-right, ears pointed -->
  <g opacity="0.09" fill="#bca8ff">
    <path d="M1540 285 L1590 140 L1642 262 Z"/>
    <path d="M1740 285 L1690 140 L1638 262 Z"/>
    <circle cx="1640" cy="420" r="98"/>
    <path d="M1640 420 c 0 0 -26 22 -38 42 l 38 38 l 38 -38 c -12 -20 -38 -42 -38 -42 Z" fill="#86dfce" opacity="0.22"/>
  </g>
  <!-- Subtle vignette and scanlines -->
  <rect width="1920" height="1080" fill="none" stroke="#bca8ff" stroke-opacity="0.05" stroke-width="2"/>
  <g opacity="0.04">
    <rect y="0" width="1920" height="2" fill="#ffffff"/><rect y="48" width="1920" height="1" fill="#ffffff"/><rect y="96" width="1920" height="1" fill="#ffffff"/>
  </g>
</svg>
