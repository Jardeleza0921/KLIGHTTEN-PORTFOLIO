<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Fox Crimson Red anime background">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#150e10"/>
      <stop offset="55%" stop-color="#211619"/>
      <stop offset="100%" stop-color="#2e1a1d"/>
    </linearGradient>
    <radialGradient id="crimsonGlow" cx="22%" cy="20%" r="58%">
      <stop offset="0%" stop-color="#ff9199" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff9199" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberWarm" cx="84%" cy="78%" r="55%">
      <stop offset="0%" stop-color="#f7b89e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f7b89e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="deepCrimson" cx="50%" cy="116%" r="70%">
      <stop offset="0%" stop-color="#ff5f6d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff5f6d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="diag" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 24H48" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="toriiFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#crimsonGlow)"/>
  <rect width="1920" height="1080" fill="url(#amberWarm)"/>
  <rect width="1920" height="1080" fill="url(#deepCrimson)"/>
  <!-- Torii-inspired horizon — shrine silhouette, not childish -->
  <path d="M0 780 L88 748 L160 720 L240 738 L320 698 L400 712 L480 672 L560 688 L640 632 L720 648 L800 612 L880 628 L960 588 L1040 604 L1120 564 L1200 582 L1280 544 L1360 562 L1440 524 L1520 544 L1600 504 L1680 524 L1760 488 L1840 508 L1920 472 L1920 1080 L0 1080 Z" fill="#1f1316" opacity="0.62"/>
  <!-- Torii gate silhouette — faint, atmospheric -->
  <g opacity="0.14" fill="#ff9199">
    <!-- Left pillar + right pillar -->
    <rect x="740" y="520" width="18" height="230" rx="2"/><rect x="1140" y="520" width="18" height="230" rx="2"/>
    <!-- Crossbeams -->
    <rect x="680" y="500" width="560" height="18" rx="6"/><rect x="700" y="532" width="520" height="10" rx="4"/>
    <!-- Top curve -->
    <path d="M660 498 Q960 440 1260 498 L1240 514 Q960 462 680 514 Z"/>
  </g>
  <path d="M0 820 L120 798 L240 778 L360 758 L480 738 L600 718 L720 698 L840 678 L960 658 L1080 638 L1200 618 L1320 598 L1440 578 L1560 560 L1680 544 L1800 530 L1920 518 L1920 1080 L0 1080 Z" fill="url(#toriiFade)" opacity="0.85"/>
  <!-- Crimson lantern glow -->
  <g opacity="0.32" fill="#ff9199">
    <rect x="760" y="620" width="22" height="28" rx="6" opacity="0.28"/>
    <rect x="1120" y="620" width="22" height="28" rx="6" opacity="0.28"/>
    <circle cx="960" cy="560" r="3.5" opacity="0.5"/>
  </g>
  <g fill="#f7b89e" opacity="0.14">
    <circle cx="520" cy="680" r="1.4"/><circle cx="740" cy="640" r="1.2"/><circle cx="1180" cy="590" r="1.6"/><circle cx="1440" cy="550" r="1.2"/>
  </g>
  <rect width="1920" height="1080" fill="url(#diag)" opacity="0.5"/>
  <!-- Fox silhouette — faint top-right -->
  <g opacity="0.08" fill="#ff9199">
    <path d="M1528 268 L1572 132 L1632 206 Z"/><path d="M1752 268 L1708 132 L1648 206 Z"/>
    <path d="M1640 206 c -68 0 -118 46 -118 106 c 0 46 34 76 58 102 l60 54 l60 -54 c 24 -26 58 -56 58 -102 c 0 -60 -50 -106 -118 -106 Z"/>
    <ellipse cx="1640" cy="258" rx="18" ry="12" fill="#f7b89e" opacity="0.18"/>
  </g>
</svg>
