<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Bunny Dark-Mint anime background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a110f"/>
      <stop offset="100%" stop-color="#101d16"/>
    </linearGradient>
    <radialGradient id="mintGlow" cx="22%" cy="18%" r="58%">
      <stop offset="0%" stop-color="#a0dda5" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#a0dda5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softAura" cx="78%" cy="88%" r="55%">
      <stop offset="0%" stop-color="#b5e8c3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#b5e8c3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depth" cx="50%" cy="112%" r="72%">
      <stop offset="0%" stop-color="#6ec8a5" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#6ec8a5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#mintGlow)"/>
  <rect width="1920" height="1080" fill="url(#softAura)"/>
  <rect width="1920" height="1080" fill="url(#depth)"/>
  <!-- Soft horizon city silhouette — low, calm, futuristic -->
  <path d="M0 780 L88 748 L132 720 L184 740 L240 698 L312 712 L368 672 L420 700 L480 658 L540 680 L600 632 L672 648 L740 612 L800 632 L880 592 L960 618 L1020 582 L1100 605 L1176 568 L1260 592 L1340 554 L1420 578 L1500 540 L1580 562 L1660 520 L1728 548 L1800 512 L1920 536 L1920 1080 L0 1080 Z" fill="#0f1f18" opacity="0.55"/>
  <path d="M0 810 L60 795 L120 782 L200 768 L280 752 L360 740 L440 722 L520 708 L600 690 L680 675 L760 660 L840 642 L920 628 L1000 612 L1080 598 L1160 584 L1240 570 L1320 558 L1400 545 L1480 532 L1560 522 L1640 514 L1720 508 L1800 502 L1920 496 L1920 1080 L0 1080 Z" fill="url(#horizon)" opacity="0.85"/>
  <!-- Mint window lights -->
  <g fill="#a0dda5" opacity="0.28">
    <rect x="420" y="720" width="18" height="26" rx="2"/><rect x="520" y="700" width="14" height="22" rx="2"/><rect x="740" y="640" width="16" height="28" rx="2"/>
    <rect x="960" y="640" width="20" height="24" rx="2"/><rect x="1180" y="600" width="14" height="26" rx="2"/><rect x="1420" y="570" width="18" height="22" rx="2"/>
    <rect x="1580" y="560" width="12" height="20" rx="2"/><rect x="1680" y="545" width="16" height="24" rx="2"/>
  </g>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.45"/>
  <!-- Bunny silhouette — faint, top-right -->
  <g opacity="0.08" fill="#b5e8c3">
    <ellipse cx="1680" cy="310" rx="42" ry="118" transform="rotate(-8 1680 310)"/>
    <ellipse cx="1540" cy="310" rx="42" ry="118" transform="rotate(8 1540 310)"/>
    <circle cx="1610" cy="520" r="96"/>
    <ellipse cx="1610" cy="560" rx="62" ry="42" fill="#a0dda5" opacity="0.12"/>
  </g>
  <!-- Soft vignette -->
  <rect width="1920" height="1080" fill="none" stroke="#a0dda5" stroke-opacity="0.06" stroke-width="2"/>
</svg>
