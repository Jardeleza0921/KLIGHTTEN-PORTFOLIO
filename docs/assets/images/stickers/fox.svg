<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Fox mascot sticker — Crimson Red theme">
  <defs>
    <linearGradient id="fFox" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#ff9a8a"/>
      <stop offset="48%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
    <linearGradient id="fInnerFox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe1d6"/>
      <stop offset="100%" stop-color="#ffb8a8"/>
    </linearGradient>
    <linearGradient id="fWhite" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff8f2"/>
      <stop offset="100%" stop-color="#ffede0"/>
    </linearGradient>
    <filter id="shadowFox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#150e10" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect x="6" y="6" width="188" height="188" rx="42" fill="white" opacity="0.97" filter="url(#shadowFox)"/>
  <rect x="10" y="10" width="180" height="180" rx="38" fill="#150e10" opacity="0.03"/>
  <!-- Ears -->
  <path d="M46 68 L62 20 L88 56 Z" fill="url(#fFox)" stroke="white" stroke-width="5" stroke-linejoin="round"/>
  <path d="M154 68 L138 20 L112 56 Z" fill="url(#fFox)" stroke="white" stroke-width="5" stroke-linejoin="round"/>
  <path d="M56 60 L67 30 L82 52 Z" fill="url(#fInnerFox)"/>
  <path d="M144 60 L133 30 L118 52 Z" fill="url(#fInnerFox)"/>
  <!-- Ear tips dark -->
  <path d="M62 20 L66 32 L76 42 L88 56 L46 68 Z" fill="#1a0f12" opacity="0.12"/>
  <path d="M138 20 L134 32 L124 42 L112 56 L154 68 Z" fill="#1a0f12" opacity="0.12"/>
  <!-- Head -->
  <path d="M100 60 c -36 0 -64 24 -64 54 c 0 26 18 42 30 52 l34 28 l34 -28 c 12 -10 30 -26 30 -52 c 0 -30 -28 -54 -64 -54 Z" fill="url(#fFox)" stroke="white" stroke-width="5" stroke-linejoin="round"/>
  <!-- Muzzle white -->
  <path d="M64 122 c 0 0 10 22 36 28 c 26 -6 36 -28 36 -28 c 0 0 -8 -18 -36 -18 c -28 0 -36 18 -36 18 Z" fill="url(#fWhite)" stroke="white" stroke-width="1.5"/>
  <ellipse cx="100" cy="116" rx="8.5" ry="6" fill="#1a0f12"/>
  <ellipse cx="98.5" cy="114.5" rx="2.4" ry="1.8" fill="white" opacity="0.92"/>
  <path d="M92 130 q8 6 16 0" fill="none" stroke="#1a0f12" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="80" cy="98" rx="7.5" ry="9" fill="#1a0f12"/>
  <ellipse cx="120" cy="98" rx="7.5" ry="9" fill="#1a0f12"/>
  <circle cx="82" cy="96" r="2.6" fill="white" opacity="0.95"/>
  <circle cx="122" cy="96" r="2.6" fill="white" opacity="0.95"/>
  <ellipse cx="80" cy="101.5" rx="3" ry="2" fill="#ff9a3d" opacity="0.95"/>
  <ellipse cx="120" cy="101.5" rx="3" ry="2" fill="#ff9a3d" opacity="0.95"/>
  <!-- Cheek fluff -->
  <ellipse cx="62" cy="118" rx="11" ry="14" fill="url(#fWhite)" opacity="0.96"/>
  <ellipse cx="138" cy="118" rx="11" ry="14" fill="url(#fWhite)" opacity="0.96"/>
